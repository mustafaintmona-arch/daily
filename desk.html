<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Desk</title>
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0}
:root{--navy:#0B1F33;--gold:#B9975B;--ink:#EDE9E1;--dim:#8C8578;--card:#12293F;--card2:#0E2334;
 --line:#1E3A54;--ok:#4CAF7D;--bad:#D46A5E}
body{background:var(--navy);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font-family:inherit}
.hide{display:none!important}
header{display:flex;align-items:center;gap:14px;padding:12px 18px 0;border-bottom:1px solid var(--line);
 background:var(--card2);flex:0 0 auto;flex-wrap:wrap}
header h1{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;white-space:nowrap}
header .sp{flex:1}
/* tabs sit on their own line so the buttons on the right are never pushed off */
.tabs{display:flex;gap:4px;background:var(--navy);border:1px solid var(--line);border-radius:11px;padding:3px;
 order:9;flex:0 0 100%;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-ms-overflow-style:none;
 margin:10px 0 12px;cursor:grab;scroll-behavior:smooth;overscroll-behavior-x:contain}
.tabs::-webkit-scrollbar{display:none}
.tabs.drag{cursor:grabbing;scroll-behavior:auto}
.tabs.drag b{pointer-events:none}
.tabwrap{order:9;flex:0 0 100%;position:relative}
.tabwrap:after{content:'';position:absolute;top:0;right:0;bottom:0;width:34px;pointer-events:none;
 background:linear-gradient(90deg,rgba(11,31,51,0),var(--card2));opacity:0;transition:opacity .15s}
.tabwrap.more:after{opacity:1}
.tabs b{font-size:12.5px;padding:7px 15px;border-radius:8px;color:var(--dim);font-weight:600;cursor:pointer;white-space:nowrap}
.tabs b.on{background:var(--gold);color:var(--navy)}
.tabs b i{font-style:normal;opacity:.6;margin-left:6px}
.btn{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:9px;
 padding:8px 14px;font-size:12.5px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--navy);font-weight:600}
.pill{font-size:11px;color:var(--dim);white-space:nowrap}
.pill b{color:var(--gold);font-weight:600}
main{flex:1;overflow:auto}
.empty{max-width:620px;margin:70px auto;text-align:center;padding:0 20px}
.empty h2{font-family:Georgia,serif;font-size:26px;margin-bottom:12px;font-weight:400}
.empty p{color:var(--dim);font-size:14px;line-height:1.7;margin-bottom:22px}
.drop{border:2px dashed var(--line);border-radius:16px;padding:44px 20px;color:var(--dim);cursor:pointer}
.drop.over{border-color:var(--gold);background:rgba(185,151,91,.07);color:var(--gold)}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px}
thead th{position:sticky;top:0;z-index:5;background:var(--card2);border-bottom:1px solid var(--line);
 text-align:left;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);
 font-weight:600;padding:10px 9px;white-space:nowrap}
tbody td{border-bottom:1px solid var(--line);padding:0;vertical-align:middle}
tbody tr:hover td{background:rgba(255,255,255,.02)}
tbody tr.dead td{opacity:.45}
td input,td select{width:100%;background:transparent;border:0;color:var(--ink);padding:9px;font-size:13px;
 outline:0;min-width:72px}
td input:focus,td select:focus{background:var(--card);box-shadow:inset 0 0 0 1px var(--gold);border-radius:4px}
td select{cursor:pointer}
td select option{background:var(--card)}
td.num input{text-align:right;font-variant-numeric:tabular-nums}
td.calc{padding:9px;text-align:right;font-family:Georgia,serif;color:var(--gold);white-space:nowrap;
 font-variant-numeric:tabular-nums}
td.wide input{min-width:190px}
td.idx{padding:9px;color:var(--dim);font-size:11px;text-align:right;width:38px;position:sticky;left:0;
 background:var(--navy);z-index:2}
tbody tr:hover td.idx{background:var(--card2)}
td.del{width:34px;text-align:center}
td.del button{background:none;border:0;color:var(--dim);font-size:15px;cursor:pointer;padding:6px}
td.del button:hover{color:var(--bad)}
.stage0{color:#5A6B7C}.stage1{color:#3E7CA6}.stage2{color:var(--gold)}.stage3{color:#D9A64A}
.stage4{color:var(--ok)}.stage5{color:var(--bad)}
.bar{display:flex;align-items:center;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line);
 background:var(--navy);flex-wrap:wrap;flex:0 0 auto}
.bar input[type=text]{background:var(--card2);border:1px solid var(--line);border-radius:9px;
 color:var(--ink);padding:8px 12px;font-size:13px;width:250px;outline:0}
.bar input[type=text]:focus{border-color:var(--gold)}
.bar select{background:var(--card2);border:1px solid var(--line);border-radius:9px;color:var(--ink);
 padding:8px 10px;font-size:12.5px;outline:0;cursor:pointer}
.sheet{position:fixed;inset:0;background:rgba(4,12,20,.72);z-index:60;display:none;
 align-items:center;justify-content:center;padding:30px}
.sheet.on{display:flex}
.sheet .inner{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;
 width:100%;max-width:860px;max-height:86vh;overflow:auto}
.sheet h3{font-family:Georgia,serif;font-size:20px;font-weight:400;margin-bottom:6px}
.sheet p.h{color:var(--dim);font-size:12.5px;line-height:1.6;margin-bottom:14px}
.sheet textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:11px;
 color:var(--ink);padding:12px;font-size:13px;outline:0;resize:vertical;
 font-family:ui-monospace,Menlo,monospace;line-height:1.6}
.sheet textarea:focus{border-color:var(--gold)}
.sbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.prev{margin-top:14px;border:1px solid var(--line);border-radius:11px;overflow:auto;max-height:38vh}
.prev table{font-size:12px}
.prev td{padding:7px 9px;border-bottom:1px solid var(--line)}
.prev .miss{color:var(--dim)}
.ck{width:15px;height:15px;accent-color:var(--gold);cursor:pointer;margin:0}
td.idx{text-align:center}
.rv{padding:18px 20px 40px;max-width:1500px}
.rv h3{font-family:Georgia,serif;font-size:22px;font-weight:400;margin:0 0 4px}
.rv .sub{color:var(--dim);font-size:12.5px;margin-bottom:20px}
.rv h4{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);
 margin:26px 0 11px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.rv .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:22px}
.rvg{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px}
.rvg div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.rvg u{display:block;text-decoration:none;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.rvg b{font-family:Georgia,serif;font-size:20px;color:var(--gold);font-weight:400;display:block;margin-top:5px}
.rvg s{display:block;text-decoration:none;font-size:10.5px;color:var(--dim);margin-top:3px}
.rvg div.bad b{color:var(--bad)} .rvg div.good b{color:var(--ok)}
.need{background:rgba(185,151,91,.1);border:1px solid rgba(185,151,91,.4);border-radius:12px;
 padding:13px 15px;margin-top:12px;font-size:13.5px;line-height:1.7}
.need b{color:var(--gold)}
.rvl{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.rvl .r{display:flex;justify-content:space-between;gap:12px;padding:10px 13px;border-bottom:1px solid var(--line);font-size:13px}
.rvl .r:last-child{border-bottom:0}
.rvl .r span.m{color:var(--dim);font-size:11.5px}
.rvl .r em{font-style:normal;font-family:Georgia,serif;color:var(--gold);white-space:nowrap}
.rvl .r.warn em{color:var(--bad)}
.rvl .none{padding:12px 13px;color:var(--dim);font-size:12.5px}
.sd{display:flex;justify-content:space-between;gap:10px;padding:9px 13px;border-bottom:1px solid var(--line);font-size:13px}
.sd:last-child{border-bottom:0}
.sd u{text-decoration:none;color:var(--dim);font-size:11px}
.sd .bar2{flex:1;display:flex;gap:3px;align-items:center;max-width:190px}
.sd .bar2 i{height:7px;border-radius:3px;display:block}
.sd .bar2 i.b{background:#3E7CA6}.sd .bar2 i.s{background:var(--gold)}
.jbox{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:13px;margin-top:10px}
.jbox label{display:block;font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--gold);margin-bottom:6px}
.jbox textarea{width:100%;background:transparent;border:0;color:var(--ink);font-size:13.5px;outline:0;
 resize:vertical;line-height:1.6;font-family:inherit;min-height:46px}
.cl{padding:16px 18px 44px;max-width:1180px}
.clseg{display:flex;gap:5px;background:var(--card2);border:1px solid var(--line);border-radius:13px;
 padding:4px;margin-bottom:16px;width:max-content}
.clseg b{font-size:12.5px;padding:8px 16px;border-radius:10px;color:var(--dim);font-weight:600;cursor:pointer}
.clseg b.on{background:var(--gold);color:var(--navy)}
.clf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.clf div{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.clf u{display:block;text-decoration:none;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.clf b{font-family:Georgia,serif;font-size:19px;color:var(--gold);font-weight:400;display:block;margin-top:4px}
.clf s{display:block;text-decoration:none;font-size:10px;color:var(--dim);margin-top:2px}
.pc{background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--line);
 border-radius:14px;padding:14px 16px;margin-bottom:10px}
.pc.due{border-left-color:var(--bad)}
.pc.soon{border-left-color:var(--gold)}
.pc .ph2{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pc .nm{font-size:15.5px;font-weight:600}
.pc .mt{font-size:11.5px;color:var(--dim);margin-top:3px}
.pc .wh{font-size:12.5px;color:var(--ink);background:rgba(255,255,255,.03);border:1px solid var(--line);
 border-radius:9px;padding:9px 11px;margin-top:10px;line-height:1.5}
.pc .when{font-size:12px;color:var(--dim);white-space:nowrap;text-align:right}
.pc .when.od{color:var(--bad)}
.pc .acts2{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.pc .acts2 a,.pc .acts2 button{border:1px solid var(--line);background:transparent;color:var(--gold);
 border-radius:10px;padding:9px 15px;font-size:12.5px;text-decoration:none;cursor:pointer;font-family:inherit}
.pc .acts2 a.wa{background:var(--gold);color:var(--navy);border-color:var(--gold);font-weight:600}
.pc .acts2 button.lnk{border:0;color:var(--dim);padding:9px 4px;text-decoration:underline}
.outs{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:11px}
.outs button{flex:1;min-width:96px;background:transparent;border:1px solid var(--line);color:var(--dim);
 border-radius:9px;padding:9px 6px;font-size:11.5px;cursor:pointer;font-family:inherit}
.outs button:hover{border-color:var(--gold);color:var(--gold)}
.outs button.warn:hover{border-color:var(--bad);color:var(--bad)}
.tplbox{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:var(--card2)}
.tplbox h5{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:0 0 8px}
.tplbox p{font-size:13px;line-height:1.65;white-space:pre-wrap;color:var(--ink);margin:0 0 11px}
.mk{padding:16px 18px 40px}
.mksets{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}
.mksets b{display:flex;align-items:center;gap:7px;font-size:12.5px;padding:8px 13px;border-radius:20px;
 background:var(--card2);border:1px solid var(--line);color:var(--dim);font-weight:600;cursor:pointer}
.mksets b.on{background:var(--gold);border-color:var(--gold);color:var(--navy)}
.mksets b.add{color:var(--gold);border-style:dashed}
.mksets b u{text-decoration:none;opacity:.6;font-weight:400}
.mksets b q{quotes:none;opacity:.45;font-size:14px;line-height:1}
.mksets b q:hover{opacity:1;color:var(--bad)}
.mkbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:15px}
.mkbar input[type=text]{background:var(--card2);border:1px solid var(--line);border-radius:9px;
 color:var(--ink);padding:8px 12px;font-size:13px;width:270px;outline:0}
.mkbar input[type=date],.mkbar select{background:var(--card2);border:1px solid var(--line);
 border-radius:9px;color:var(--ink);padding:8px 10px;font-size:12.5px;outline:0}
.mkbar input:focus,.mkbar select:focus{border-color:var(--gold)}
.mkread{background:rgba(185,151,91,.11);border:1px solid rgba(185,151,91,.4);border-radius:11px;
 padding:12px 14px;font-size:13px;color:var(--ink);margin-top:6px}
.mk .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:11px;margin-bottom:20px}
.mk .grid div{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.mk .grid u{display:block;text-decoration:none;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}
.mk .grid b{font-family:Georgia,serif;font-size:21px;color:var(--gold);font-weight:400;display:block;margin-top:5px}
.mk .grid s{display:block;text-decoration:none;font-size:10.5px;color:var(--dim);margin-top:3px}
.mk h4{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);margin:22px 0 10px}
.mk table{width:100%;min-width:0}
.mk td,.mk th{padding:8px 10px}
.qbars{display:flex;align-items:flex-end;gap:5px;height:110px;margin-bottom:6px}
.qbars s{flex:1;text-decoration:none;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.qbars s em{display:block;background:var(--gold);border-radius:4px 4px 0 0;min-height:2px;opacity:.65}
.qbars s.pk em{opacity:1}
.qbars s q{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:9px;color:var(--dim);quotes:none}
.qwrap{padding-bottom:22px}
.cmpt{width:100%;font-size:13px}
.cmpt th{background:var(--card2)}
.cmpt td{border-bottom:1px solid var(--line);padding:9px 11px}
.cmpt td.lab{color:var(--dim);font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.cmpt td.best{color:var(--ok)}
.pres{position:fixed;inset:0;background:var(--navy);z-index:80;display:none;flex-direction:column;padding:40px 46px}
.pres.on{display:flex}
.pres .ph{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--gold);
 padding-bottom:14px;margin-bottom:26px}
.pres .ph h2{font-family:Georgia,serif;font-size:30px;font-weight:400}
.pres .ph span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.pres .body{flex:1;overflow:auto}
.pres table{width:100%;font-size:17px}
.pres td{padding:14px 12px;border-bottom:1px solid var(--line)}
.pres td.lab{color:var(--dim);font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.pres td.v{font-family:Georgia,serif;font-size:20px;color:var(--gold);text-align:right}
.pres .pf{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
@media print{body>*{display:none!important}.pres{display:flex!important;position:static;background:#fff;color:#111}
 .pres .ph h2{color:#0B1F33}.pres td.v{color:#0B1F33}.pres .pf{display:none}
 .pres td{border-color:#ddd}.pres td.lab{color:#666}}
.demoban{background:rgba(185,151,91,.13);border-bottom:1px solid rgba(185,151,91,.4);color:var(--gold);
 padding:8px 18px;font-size:12px;display:flex;align-items:center;gap:12px;flex:0 0 auto}
.demoban button{background:transparent;border:1px solid rgba(185,151,91,.5);color:var(--gold);
 border-radius:8px;padding:5px 11px;font-size:11.5px;cursor:pointer}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--navy);
 padding:11px 20px;border-radius:11px;font-size:13px;font-weight:600;z-index:90;opacity:0;
 transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}

/* ---- unit panel + tools ---- */
.udrawer{position:fixed;top:0;right:0;width:min(760px,92vw);height:100%;background:var(--navy);
 border-left:1px solid rgba(185,151,91,.35);z-index:60;overflow:auto;transform:translateX(102%);
 transition:transform .18s ease;box-shadow:-18px 0 50px rgba(0,0,0,.45)}
.udrawer.on{transform:none}
.udh{position:sticky;top:0;background:var(--navy);padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);
 display:flex;align-items:center;gap:12px;z-index:2}
.udh h3{margin:0;font-size:16px;color:var(--ink);flex:1}
.udb{padding:18px 20px 60px}
.uimgs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.uimg{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:10px;overflow:hidden}
.uimg .cap{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);padding:8px 10px}
.uimg img{width:100%;display:block;cursor:zoom-in;background:#08131e}
.uspec{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.uspec div{background:var(--card2);border-radius:8px;padding:10px 12px}
.uspec .l{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.uspec .v{font-size:15px;color:var(--ink);margin-top:3px}
.lightbox{position:fixed;inset:0;background:rgba(4,10,16,.94);z-index:90;display:none;
 align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
.lightbox.on{display:flex}
.lightbox img{max-width:100%;max-height:100%;border-radius:8px}
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;padding:18px}
.tool{background:var(--card);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:16px}
.tool h4{margin:0 0 4px;font-size:14px;color:var(--gold)}
.tool .sub{font-size:11px;color:var(--dim);margin-bottom:12px}
.tool label{display:block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:9px 0 4px}
.tool input,.tool select{width:100%;background:var(--card2);border:1px solid rgba(255,255,255,.12);
 border-radius:7px;color:var(--ink);padding:8px 10px;font-size:14px;font-family:inherit}
.tool input:focus,.tool select:focus{outline:none;border-color:var(--gold)}
.t2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tout{margin-top:14px;border-top:1px solid rgba(255,255,255,.1);padding-top:10px}
.trow{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:13px;
 border-bottom:1px solid rgba(255,255,255,.05)}
.trow .l{color:var(--dim)}
.trow .l b{display:block;color:var(--ink);font-weight:400}
.trow.big{font-size:15px}
.trow.big .v{color:var(--gold);font-weight:600}
.tseg{display:flex;gap:0;margin-bottom:10px;border:1px solid rgba(255,255,255,.14);border-radius:8px;overflow:hidden}
.tseg b{flex:1;text-align:center;padding:7px;font-size:12px;font-weight:500;cursor:pointer;color:var(--dim)}
.tseg b.on{background:var(--gold);color:var(--navy);font-weight:600}
.warnline{color:#E88;font-size:12px;margin-top:8px}
@media print{body *{visibility:hidden}#pr,#pr *{visibility:visible}
 #pr{position:absolute;left:0;top:0;width:100%}}

/* ---- bulk fill ---- */
.bf{width:100%;border-collapse:collapse}
.bf th{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
 text-align:left;padding:0 10px 8px;font-weight:600}
.bf td{padding:0 4px 6px 0}
.bf td:first-child{padding-left:0}
.bf .who{font-size:14px;color:var(--ink);white-space:nowrap;padding-right:14px}
.bf .who small{display:block;font-size:11px;color:var(--dim)}
.bf input{width:100%;background:var(--card2);border:1px solid rgba(255,255,255,.1);
 border-radius:8px;color:var(--ink);padding:9px 10px;font-size:14px;font-family:inherit}
.bf input:focus{outline:none;border-color:var(--gold);background:#0d2436}
.bf input.done{border-color:rgba(76,175,125,.55)}
.bfbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.bfbar .c{font-size:13px;color:var(--dim);flex:1}

  var rq=indexedDB.open('deskimgs',1);
  rq.onupgradeneeded=function(){rq.result.createObjectStore('img');};
  rq.onsuccess=function(){IDB=rq.result;res(IDB);};

 });
}
function idbPutAll(map){
 var ks=Object.keys(map||{});
 if(!ks.length)return Promise.resolve(0);
 return idbOpen().then(function(db){return new Promise(function(res,rej){
  var t=db.transaction('img','readwrite'), st=t.objectStore('img');
  ks.forEach(function(k){st.put(map[k],k);});
  t.oncomplete=function(){res(ks.length);};t.onerror=function(){rej(t.error);};
 });}).catch(function(){return 0;});
}
function idbAll(){
 return idbOpen().then(function(db){return new Promise(function(res){
  var out={}, t=db.transaction('img','readonly'), st=t.objectStore('img');
  var rq=st.openCursor();
  rq.onsuccess=function(){var c=rq.result; if(!c){res(out);return;} out[c.key]=c.value; c.continue();};
  rq.onerror=function(){res(out);};
 });}).catch(function(){return {};});
}

 while(i)h=(h*33^st.charCodeAt(--i))>>>0;return h.toString(36);}
function indexBy(arr,kf){var m={};(arr||[]).forEach(function(x,i){var k=kf(x);if(!k)k='#'+i;
 if(m[k])k=k+'#'+i;m[k]={x:x,i:i,h:hashOf(x)};});return m;}
function isEmpty(v){return v===undefined||v===null||v===''||v===0||

function mergeRec(mine,their){

function pass(r){

  if(F==='Stuck 14+ days')return num(r.s)<4&&r.sAt&&dayd(r.sAt,TD)<-14;
  if(F==='Biggest fee first')return num(r.s)<5;
  if(F==='No criteria')return !num(r.lmax)&&!num(r.lbd)&&!(r.lcom||'');
  return STAGES[num(r.s)]===F;}
 if(TAB==='units'){
  if(F==='Permit expiring or gone'){
   var a=r.faTo?dayd(r.faTo,TD):null, t=r.tkTo?dayd(r.tkTo,TD):null, w=null;
   [a,t].forEach(function(x){if(x===null)return; if(w===null||x<w)w=x;});
   return w!==null&&w<=21;}
  if(F==='No paperwork')return !r.faTo&&!r.tkTo;
  if(F==='Live only')return (r.st||'Available')==='Available'||r.st==='Reserved';
  if(F==='For sale')return (r.lt||'Sale')==='Sale';
  if(F==='For rent')return r.lt==='Rent';
  if(F==='No price')return !num(r.pr)&&!num(r.rent);
  if(F==='No original price')return !num(r.op);
  return r.com===F;}
 if(TAB==='later'){
  if(F==='Due now')return r.wd&&r.wd<=TD;
  return r.ty===F;}
 if(TAB==='dates'){

function parseUnit(txt){
 var t=' '+txt.replace(/ /g,' ')+' ';
 function n(x){return Number(String(x).replace(/,/g,''));}
 function mm(re){return t.match(re);}
 var o={};
 var price=mm(/(?:aed|price|asking|selling)\D{0,12}([\d,]{5,})\s*(m|mn|million)?/i);
 if(price){var v=n(price[1]); if(price[2])v*=1e6; o.pr=Math.round(v);}
 if(!o.pr){var alt=mm(/([\d.]+)\s*(?:m|mn|million)\b/i); if(alt)o.pr=Math.round(parseFloat(alt[1])*1e6);}
 if(!o.pr){var bare=t.match(/\b\d{1,3}(?:,\d{3})+\b/g);
  if(bare){var c=bare.map(n).filter(function(x){return x>=50000;});
   if(c.length)o.pr=Math.max.apply(null,c);}}
 var bd=mm(/(\d+)\s*(?:br|bed|bedroom|bhk)/i); if(bd)o.bd=+bd[1];
 var bua=mm(/([\d,]{3,})\s*(?:sq\.?\s?ft|sqft)\s*(?:bua|built[\s-]?up)/i);
 if(!bua)bua=mm(/(?:bua|built[\s-]?up|size|area)[^\d]{0,8}([\d,]{3,})/i);
 if(bua)o.bua=n(bua[1]);
 if(!o.bua){var sq=mm(/([\d,]{3,})\s*(?:sq\.?\s?ft|sqft|sf)\b/i); if(sq)o.bua=n(sq[1]);}
 var plot=mm(/(?:plot|land)\D{0,10}([\d,]{3,})/i); if(plot)o.plot=n(plot[1]);
 var ho=mm(/(?:handover|completion|ready(?:\s+in)?)\D{0,12}(q[1-4]\s*\d{4}|\w{3,9}\s*\d{4}|\d{4})/i);
 if(ho)o.h=ho[1].replace(/\s+/g,' ').trim();
 var un=mm(/(?:unit|villa|no\.?|#)\s*([A-Z]?-?\d{1,4}[A-Z]?)\b/i);
 var rent=/\b(rent|rental|per\s*(?:year|annum)|p\.?a\.?|yearly)\b/i.test(t);
 o.lt=rent?'Rent':'Sale';
 if(rent&&o.pr){o.rent=o.pr;o.pr=0;}
 var COMS=['Farm Gardens','Farm Grove','Elora','Rivana','Nima','Lillia','Orania','Talia','Nara','Eden','Alana','Elea',
  'DAMAC Lagoons','DAMAC Islands','DAMAC Hills','Ghaf Woods','Golf Estates','Jumeirah Park','Palm Jumeirah',
  'Creek Harbour','Dubai Hills','Mina Rashid','Maritime City','Motor City','Arabian Ranches',
  'Emaar South','Dubai South','Business Bay','Marina','The Valley'];
 var found=COMS.filter(function(cm){return t.toLowerCase().indexOf(cm.toLowerCase())>=0;});
 if(found.length){o.com=found[0];o.p=o.com+(un?' '+un[1]:'');}
 else {o.p=((txt.trim().split('\n')[0])||'').slice(0,44)||'Untitled unit';}
 o.t=(o.bd?o.bd+'BR ':'')+(/town\s*house|\bth\b/i.test(t)?'townhouse':(/villa/i.test(t)?'villa':
  (/apartment|apt|flat/i.test(t)?'apartment':(/office/i.test(t)?'office':'unit'))));
 o.tag=/off[\s-]?plan|launch|payment plan/i.test(t)?'Off-plan':(/resale|secondary/i.test(t)?'Resale':
  (/distress|motivated|urgent/i.test(t)?'Distress':''));
 o.n=txt.trim().slice(0,300);
 return o;
}

 var out=[],cur='',q=false;
 for(var i=0;i<line.length;i++){var c=line[i];
  if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++;}else q=!q;}
  else if(c===d&&!q){out.push(cur);cur='';}
  else cur+=c;}
 out.push(cur);return out.map(function(x){return x.trim().replace(/^"|"$/g,'');});
}

 if(lines.length<2)return null;

  for(var pi=0;pi<pats.length;pi++)for(var i=0;i<head.length;i++)
   if(head[i].indexOf(pats[pi])>=0)return i;
  return -1;}
 var isRent=head.join(' ').match(/annual amount|contract amount|ejari|tenant|contract start/)?1:0;
 var cAmt=isRent?find('annual amount','contract amount','rent','amount')
                :find('price','amount','value','consideration');
 var cDate=find('instance date','transaction date','contract start','date');
 var cPsf=find('per sqft','/sqft','psf','price per');
 var cArea=find('sqft','size','area sq','built','property size','actual area');
 var cBed=find('bed','rooms','br');
 var cLoc=find('community','master project','area name','location','project','building');
 var cUnit=find('unit','no.','property no');
 var cSold=find('sold by','seller','buyer type','party','transaction type');
 var cRec=find('record type','type of record','registration','procedure');
 var cUse=find('usage','property type','property sub');
 var out=[];
 rows.forEach(function(r){
  function g(i){return i>=0?(r[i]||''):'';}
  var rec=g(cRec).toLowerCase();
  if(rec&&(rec.indexOf('oqood')>=0||rec.indexOf('valuation')>=0||rec.indexOf('average')>=0))return;
  var amt=num(g(cAmt)); if(!amt)return;
  var dt=g(cDate),dd='';
  if(dt){var t=Date.parse(dt.replace(/(\d{2}),\s*/,'$1 ')); if(!isNaN(t))dd=iso(new Date(t));}
  out.push({a:amt,d:dd,p:num(g(cPsf)),s:num(g(cArea)),b:num(g(cBed)),
   l:g(cLoc).slice(0,42),u:g(cUnit).slice(0,14),o:g(cSold).slice(0,24),t:g(cUse).slice(0,26)});
 });
 if(!out.length)return null;
 out.forEach(function(r){if(!r.p&&r.s&&r.a)r.p=Math.round(r.a/r.s);});

 return {kind:isRent?'rent':'sale',rows:out};
}

 if(c.unitsLost)warn.push(c.unitsLost+' units would disappear');

 if(c.dncIn<c.dncHere)warn.push((c.dncHere-c.dncIn)+' blocked numbers would be unblocked');
 var msg=name+'\n\n'+
  'Clients   '+c.here.d+'  ->  '+c.incoming.d+'\n'+
  'Units     '+c.here.u+'  ->  '+c.incoming.u+'\n'+
  'Prospects '+c.here.l+'  ->  '+c.incoming.l+'\n';

function csvRows(txt){

 if(!lines.length)return [];
 function split(l){var out=[],cur='',q=false;
  for(var i=0;i<l.length;i++){var c=l[i];
   if(c==='"'){q=!q;continue;}
   if(c===','&&!q){out.push(cur);cur='';continue;}
   cur+=c;}
  out.push(cur);return out;}

 return lines.slice(1).map(function(l){var c=split(l),o={};
  head.forEach(function(h,i){o[h]=(c[i]||'').trim();});return o;});
}

function rebuildHooks(txns){

   '. Best '+beds+'BR nearby '+money(top.pr)+' (unit '+top.u+', '+monShort(top.d)+').';
  x.hkc=mineCom; x.hkb=beds;
  var bua=(me&&me.bua)?me.bua:0;
  if(!bua){var bs=pool.filter(function(t){return t.bua;}).map(function(t){return t.bua;}).sort(function(a,b){return a-b;});

function runMort(){
 var inc=TV('m-inc'),deb=TV('m-deb'),ltv=num(TS('m-ltv')),r=TV('m-r'),y=TV('m-y'),age=TV('m-age');
 var out=document.getElementById('m-out');

 if(cap<=0){out.innerHTML='<div class="warnline">Existing commitments already use the whole 50% cap. No borrowing room.</div>';return;}
 var i=r/100/12, n=yrs*12;
 var loan=i>0?cap*(1-Math.pow(1+i,-n))/i:cap*n;
 var price=ltv?loan/(ltv/100):0;
 var dep=price-loan;
 var fees=price*0.04+price*0.02*1.05+FEES.trustHi+FEES.adminReady+FEES.deed+FEES.map+loan*FEES.mortPct+FEES.mortReg;

  TR('Monthly they can pay',money(cap),'50% of income less commitments',1)+
  TR('Maximum loan',money(loan),yrs+' years at '+r+'%',1)+

  (ltv===80&&price>5000000?'<div class="warnline">That lands above AED 5M, where first-home LTV drops to 70%. '+

 if(o.h)rows.push(['On handover',hoAmt,new Date(o.h+'-01')]);

function matchScore(d,u){
 var isR=(u.lt||'Sale')==='Rent', price=isR?num(u.rent):num(u.pr), sc=0;
 var bud=num(d.lmax)||num(d.v);
 if(bud&&price){
  if(price<=bud)sc+=40; else if(price<=bud*1.1)sc+=22;
  else if(price<=bud*1.25)sc+=8; else return 0;}
 if(num(d.lbd)&&num(u.bd)){
  if(num(d.lbd)===num(u.bd))sc+=25; else if(Math.abs(num(d.lbd)-num(u.bd))===1)sc+=10;}
 var areas=(d.lcom||'').toLowerCase().split(/[,;\/]+/).map(function(x){return x.trim();}).filter(Boolean);
 var ucom=((u.com||'')+' '+(u.p||'')).toLowerCase();
 if(areas.length&&areas.some(function(a){return a&&ucom.indexOf(a)>=0;}))sc+=25;
 if(d.ty==='Rent'&&!isR)return 0;
 if(num(d.s)>=4)return 0;
 return sc<20?0:Math.min(100,sc);
}

 WAB.owners.forEach(function(o){var d=wabDigits(o.ph), k=d||String(o.n||'').toLowerCase();
  if(!k||haveL[k])return;

  st.later.push({n:o.n||('Unit '+o.u),ph:o.ph||'',w:o.c+(o.u?' '+o.u:''),ty:'Seller not now',

 (WAB.dnc||[]).forEach(function(x){var d=wabDigits(x)||x;

 try{persist();}catch(e){}

  '<div><u>Banked</u><b>'+money(won)+'</b><s>'+money(mine(won))+' to you</s></div>'+
  '<div><u>To the '+money(GOALNET)+' target</u><b>'+money(Math.max(0,target-won))+'</b><s>'+pct+'% there</s></div>'+
  (noNext?'<div><u>No next date</u><b style="color:#D46A5E">'+noNext+'</b><s>they will go quiet</s></div>':'')+
  (quiet?'<div><u>Stuck 14+ days</u><b style="color:#D46A5E">'+quiet+'</b><s>same stage</s></div>':'')+
  '<div class="bar2" style="flex-basis:100%"><i style="width:'+pct+'%"></i></div>'+
  '</div>';
}

</script>
