<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Operations Dashboard</title>
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
 --bg:#F6F7F9; --card:#FFFFFF; --line:#E9EBEF; --line2:#DFE2E8;
 --ink:#101828; --dim:#667085; --dim2:#98A2B3;
 --gold:#B9975B; --gold-d:#8A6A2F; --gold-w:#F6F0E4; --navy:#0B1F33;
 --ok:#15804A;  --ok-w:#E7F5EE;
 --bad:#C0392B; --bad-w:#FBEAE7;
 --warn:#9A6B12; --warn-w:#FCF3E2;
 --info:#1D6FCB;--info-w:#E8F1FC;
 --r:12px; --sh:0 1px 2px rgba(16,24,40,.05);
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;cursor:pointer}
.hide{display:none!important}
.app{display:flex;min-height:100vh}

/* ---------------- sidebar ---------------- */
aside{width:228px;flex:0 0 228px;background:#fff;border-right:1px solid var(--line);
 display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 14px}
.dia{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--navy);
 display:flex;align-items:center;justify-content:center}
.dia i{width:9px;height:9px;background:var(--gold);transform:rotate(45deg);border-radius:1px;display:block}
.bn{font-size:14px;font-weight:650;letter-spacing:-.01em}
.bs{font-size:10.5px;color:var(--dim2);margin-top:-2px}
nav{padding:6px 10px;flex:1;overflow:auto}
nav b{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
 font-weight:500;color:#475467;cursor:pointer;user-select:none;margin-bottom:1px}
nav b:hover{background:#F4F5F7}
nav b.on{background:var(--gold-w);color:var(--gold-d);font-weight:600}
nav b s{width:16px;text-align:center;text-decoration:none;font-size:13px;opacity:.85}
nav b u{margin-left:auto;text-decoration:none;font-size:11px;color:var(--dim2);font-variant-numeric:tabular-nums}
nav b.on u{color:var(--gold-d)}
.navsep{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);
 font-weight:600;padding:14px 10px 6px}
.me{border-top:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}
.av{width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:var(--navy);color:var(--gold);
 display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
.me div b{display:block;font-size:12.5px;font-weight:600}
.me div s{display:block;text-decoration:none;font-size:10.5px;color:var(--dim2)}

/* ---------------- main ---------------- */
main{flex:1;min-width:0;padding:18px 22px 40px}
.top{display:flex;align-items:flex-start;gap:10px;margin-bottom:16px;flex-wrap:wrap}
h1{font-size:21px;font-weight:650;letter-spacing:-.02em}
.sub{font-size:12.5px;color:var(--dim);margin-top:2px}
.top .sp{flex:1}
.chip{background:#fff;border:1px solid var(--line2);border-radius:9px;padding:7px 11px;
 font-size:12.5px;color:#344054;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
 cursor:pointer;user-select:none}
.chip:hover{background:#FAFAFB}
.chip.on{border-color:var(--gold);color:var(--gold-d);background:var(--gold-w)}
.chip.flat{cursor:default}
.chip.flat:hover{background:#fff}

/* mobile nav — the sidebar is hidden on a phone, this replaces it */
.mnav{display:none;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.mnav::-webkit-scrollbar{display:none}
.mnav b{flex:0 0 auto;background:#fff;border:1px solid var(--line2);border-radius:99px;
 padding:7px 13px;font-size:12.5px;font-weight:500;color:#475467;cursor:pointer}
.mnav b.on{background:var(--gold-w);border-color:var(--gold);color:var(--gold-d);font-weight:650}

/* banners */
.ban{border-radius:var(--r);padding:12px 15px;margin-bottom:14px;font-size:13px;display:flex;gap:10px}
.ban.red{background:var(--bad-w);color:var(--bad)}
.ban.grey{background:#EEF0F3;color:#475467}
.ban b{font-weight:700}

/* grid */
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:14px}
@media(max-width:1180px){.g4{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr}}
@media(max-width:820px){
 aside{display:none}
 .mnav{display:flex}
 .g4{grid-template-columns:1fr}
 main{padding:14px}
 #panel{width:100%!important}
}

.c{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.ch{display:flex;align-items:center;gap:10px;padding:14px 16px 0}
.ch h2{font-size:13.5px;font-weight:650;letter-spacing:-.01em}
.ch .sp{flex:1}
.cb{padding:12px 16px 14px}
.cb.flush{padding:12px 0 0}
.cf{border-top:1px solid var(--line);padding:9px;text-align:center}
.cf b{font-size:12px;font-weight:600;color:var(--gold-d);cursor:pointer}
.cf b:hover{text-decoration:underline}

/* kpi */
.k{padding:14px 16px 12px;position:relative}
.kt{font-size:12px;color:var(--dim);font-weight:500}
.kv{font-size:26px;font-weight:680;letter-spacing:-.03em;margin-top:4px;font-variant-numeric:tabular-nums}
.kd{font-size:11.5px;margin-top:6px;color:var(--dim);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.kd em{font-style:normal;font-weight:650}
.kd em.up{color:var(--ok)} .kd em.dn{color:var(--bad)} .kd em.am{color:var(--warn)}
.kico{position:absolute;top:13px;right:14px;width:28px;height:28px;border-radius:8px;
 display:flex;align-items:center;justify-content:center;font-size:13px}
.kspark{position:absolute;right:14px;bottom:12px}

/* attention */
.at{display:flex;align-items:center;gap:11px;padding:10px 0;border-bottom:1px solid #F2F4F7;cursor:pointer}
.at:last-child{border-bottom:0}
.at:hover{background:#FCFCFD}
.ai{width:26px;height:26px;flex:0 0 26px;border-radius:7px;display:flex;align-items:center;
 justify-content:center;font-size:12px}
.at .tx{flex:1;min-width:0}
.at .tx b{display:block;font-size:12.8px;font-weight:600}
.at .tx s{display:block;text-decoration:none;font-size:11.5px;color:var(--dim);
 overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:10.5px;font-weight:650;padding:4px 9px;border-radius:99px;white-space:nowrap}
.tag.r{background:var(--bad-w);color:var(--bad)}
.tag.a{background:var(--warn-w);color:var(--warn)}
.tag.b{background:var(--info-w);color:var(--info)}
.tag.g{background:var(--ok-w);color:var(--ok)}
.tag.n{background:#F2F4F7;color:#475467}
.arw{color:var(--dim2);font-size:14px}

.lg{display:flex;flex-direction:column;gap:9px;justify-content:center}
.lg div{display:flex;align-items:center;gap:8px;font-size:12px}
.lg i{width:8px;height:8px;border-radius:50%;flex:0 0 8px}
.lg s{text-decoration:none;flex:1;color:#344054}
.lg u{text-decoration:none;color:var(--dim);font-variant-numeric:tabular-nums}
.dn2{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center}
@media(max-width:1180px){.dn2{grid-template-columns:130px 1fr}}

.br{margin-bottom:11px} .br:last-child{margin-bottom:0}
.brh{display:flex;justify-content:space-between;font-size:12.2px;margin-bottom:5px}
.brh u{text-decoration:none;color:var(--dim);font-variant-numeric:tabular-nums;font-weight:600}
.trk{height:5px;background:#F2F4F7;border-radius:99px;overflow:hidden}
.trk i{display:block;height:100%;border-radius:99px}

.tl{display:flex;align-items:center;gap:10px;padding:8px 0;cursor:pointer;border-radius:7px}
.tl:hover{background:#FBFBFC}
.tl .sq{width:26px;height:26px;flex:0 0 26px;border-radius:7px;background:var(--navy);color:#fff;
 display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700}
.tl .nm{flex:1;min-width:0;font-size:12.8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tl .nm s{display:block;text-decoration:none;font-size:11px;color:var(--dim)}
.tl .am{font-size:12.8px;font-weight:600;font-variant-numeric:tabular-nums}

.ac{display:flex;gap:10px;padding:9px 0;align-items:flex-start}
.ac .tx{flex:1;min-width:0}
.ac .tx b{display:block;font-size:12.5px;font-weight:550}
.ac .tx s{display:block;text-decoration:none;font-size:11.3px;color:var(--dim)}
.ac .ag{font-size:11px;color:var(--dim2);white-space:nowrap}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);
 font-weight:600;padding:0 10px 8px;border-bottom:1px solid var(--line);cursor:pointer;
 user-select:none;white-space:nowrap}
th:hover{color:var(--gold-d)}
th i{font-style:normal;opacity:.55;margin-left:3px}
th.on{color:var(--gold-d)} th.on i{opacity:1}
td{padding:10px;border-bottom:1px solid #F2F4F7;font-size:12.7px;vertical-align:top}
tbody tr{cursor:pointer}
tbody tr:hover{background:#FBFBFC}
td.n,th.n{text-align:right} td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
.mut{color:var(--dim)}
.hint{font-size:12px;color:var(--dim);line-height:1.55}

/* target bar */
.stk{height:26px;border-radius:7px;overflow:hidden;display:flex;background:#F2F4F7;position:relative}
.stk i{display:block;height:100%}
.tgt{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--navy);border-radius:2px}
.tgl{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:7px;gap:10px;flex-wrap:wrap}

.priv .msk{filter:blur(5px);user-select:none}
.drop{border:1.5px dashed var(--line2);border-radius:var(--r);padding:34px;text-align:center;background:#fff}
.drop.hot{border-color:var(--gold);background:var(--gold-w)}

/* ---------------- detail panel ---------------- */
#scrim{position:fixed;inset:0;background:rgba(16,24,40,.28);opacity:0;pointer-events:none;
 transition:opacity .18s ease;z-index:40}
#scrim.on{opacity:1;pointer-events:auto}
#panel{position:fixed;top:0;right:0;bottom:0;width:470px;max-width:100%;background:#fff;
 border-left:1px solid var(--line);box-shadow:-14px 0 40px -22px rgba(16,24,40,.45);
 transform:translateX(102%);transition:transform .22s cubic-bezier(.22,.8,.3,1);
 z-index:41;display:flex;flex-direction:column}
#panel.on{transform:none}
.ph{display:flex;align-items:flex-start;gap:12px;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.ph .tx{flex:1;min-width:0}
.ph h3{font-size:19px;font-weight:660;letter-spacing:-.02em;line-height:1.25}
.ph .s2{font-size:12.5px;color:var(--dim);margin-top:3px}
.px{width:30px;height:30px;flex:0 0 30px;border-radius:8px;border:1px solid var(--line2);
 background:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--dim)}
.px:hover{background:#F4F5F7}
.pb{flex:1;overflow-y:auto;padding:16px 20px 30px}
.pact{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);background:#FCFCFD}
.pact a{flex:1;text-align:center;text-decoration:none;border-radius:9px;padding:10px;
 font-size:13px;font-weight:600;border:1px solid var(--line2);color:#344054;background:#fff}
.pact a.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
.psec{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim2);
 font-weight:600;margin:20px 0 9px}
.psec:first-child{margin-top:0}
.pr{display:flex;gap:12px;padding:7px 0;border-bottom:1px solid #F4F5F7;font-size:12.8px}
.pr:last-child{border-bottom:0}
.pr b{flex:0 0 128px;font-weight:600;color:var(--dim)}
.pr span{flex:1;min-width:0;word-wrap:break-word}
.pnote{background:#F8F9FA;border-radius:10px;padding:13px 15px;font-size:12.7px;
 color:#344054;white-space:pre-wrap;line-height:1.6}
.phist{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid #F4F5F7}
.phist:last-child{border-bottom:0}
.phist u{text-decoration:none;flex:0 0 84px;font-size:11.5px;color:var(--dim2);white-space:nowrap}
.phist span{flex:1;font-size:12.7px}
</style>
</head>
<body>
<div class="app">
 <aside>
  <div class="brand">
   <div class="dia"><i></i></div>
   <div><div class="bn">Allegiance</div><div class="bs">Dubai</div></div>
  </div>
  <nav id="nav"></nav>
  <div class="me">
   <div class="av">MS</div>
   <div><b>Mustafa Saleh</b><s>Team lead</s></div>
  </div>
 </aside>

 <main>
  <div class="top">
   <div><h1 id="ttl">Operations Dashboard</h1><div class="sub" id="tsub">Your business at a glance.</div></div>
   <div class="sp"></div>
   <span class="chip flat" id="dchip"></span>
   <span class="chip" id="csv">Export</span>
   <span class="chip" id="eye">Hide numbers</span>
   <span class="chip" id="load">Load a backup</span>
   <input type="file" id="file" accept=".json,application/json" style="display:none">
  </div>
  <div class="mnav" id="mnav"></div>
  <div id="banner"></div>
  <div id="body"></div>
 </main>
</div>

<div id="scrim"></div>
<div id="panel">
 <div class="ph">
  <div class="tx"><h3 id="p-t">—</h3><div class="s2" id="p-s"></div></div>
  <button class="px" id="p-x">&times;</button>
 </div>
 <div class="pb" id="p-b"></div>
 <div class="pact" id="p-a"></div>
</div>

<script>
/* =========================================================================
   Operations Dashboard — reads the same daily-v4 store as index.html and
   desk.html. Read only: this page never writes to your data.

   Every number is computed from your own records. Where a figure is not in
   the data it says so rather than guessing.
   ========================================================================= */
const K='daily-v4';
const STAGES=['To call','Contacted','Interested','Agreed','Won'];
const LOST=5;
const PROB=[0.10,0.25,0.50,0.80,1.00];
const TARGET=500000, DEADLINE='2026-09-27';
const SCOL=['#98A2B3','#1D6FCB','#B9975B','#E0A42C','#15804A'];
const STALE_DAYS=2;

var S={}, PRIV=false, VIEW='dash', FILT=null, SORT={}, SPEC=null, SRC='';
const TD=new Date().toISOString().slice(0,10);

function num(x){var n=parseFloat(String(x==null?'':x).replace(/[^0-9.\-]/g,''));return isNaN(n)?0:n;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function money(n){return Math.round(num(n)).toLocaleString();}
function big(n){n=num(n);
 if(Math.abs(n)>=1e6)return (n/1e6).toFixed(n>=1e7?1:2)+'M';
 if(Math.abs(n)>=1e3)return Math.round(n/1e3)+'k';
 return String(Math.round(n));}
function pv(s){return PRIV?'<span class="msk">'+esc(s)+'</span>':esc(s);}
function pmoney(n){return PRIV?'•••':money(n);}
function ini(s){var p=String(s||'?').trim().split(/\s+/);
 return ((p[0]||'?')[0]+((p[1]||'')[0]||'')).toUpperCase().slice(0,2)||'?';}
function days(a,b){return Math.round((new Date(b)-new Date(a))/86400000);}
function ago(d){ if(!d)return '';
 var n=days(d,TD);
 if(n<=0)return 'today'; if(n===1)return '1d ago';
 if(n<30)return n+'d ago'; if(n<365)return Math.round(n/30)+'mo ago';
 return Math.round(n/365)+'y ago';}
function dmy(d){ if(!d)return '—';
 try{return new Date(d).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});}
 catch(e){return d;} }
function digits(s){return String(s||'').replace(/\D/g,'');}

/* ---------- load ---------- */
function load(){
 try{ S=JSON.parse(localStorage.getItem(K))||{}; SRC='this browser'; }catch(e){ S={}; }
 norm();
}
function norm(){
 ['deals','units','later','diary','rent','comm','ledger','kd','keydates','proj','dnc'].forEach(function(k){
  if(!Array.isArray(S[k]))S[k]=[];});
 if(!S.days||typeof S.days!=='object')S.days={};
}
function hasData(){return (S.deals&&S.deals.length)||(S.units&&S.units.length);}

/* how old is what we are looking at */
function dataAge(){
 var t=S.bkAt||(S.sync&&S.sync.at);
 if(!t)return null;
 try{ return Math.max(0,Math.round((Date.now()-new Date(t))/86400000)); }catch(e){ return null; }
}

/* ---------- the maths ---------- */
function live(){return S.deals.filter(function(d){return d.s!==LOST;});}
function fee(d){return d.ty==='Rent'? num(d.rent)*0.05 : num(d.v)*(num(d.r)||2)/100;}
function weighted(d){var s=num(d.s);return fee(d)*(PROB[s]||PROB[0]);}
function overdue(){return live().filter(function(d){return d.nd&&d.nd<TD;});}
function stageCount(){var c=[0,0,0,0,0];
 live().forEach(function(d){var s=num(d.s); if(s>=0&&s<5)c[s]++;}); return c;}
function uStat(u){return ['Available','Reserved','Sold','Withdrawn'].indexOf(u.st)>=0?u.st:'Available';}
function touches(d){return (d.hist||[]).length;}

/* ---------- charts ---------- */
function spark(vals,col){
 if(!vals||vals.length<2)return '';
 var w=104,h=34,mx=Math.max.apply(null,vals)||1,step=w/(vals.length-1);
 var pts=vals.map(function(v,i){return [i*step,h-2-(v/mx)*(h-6)];});
 var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
 var id='g'+Math.random().toString(36).slice(2,7);
 return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
  '<defs><linearGradient id="'+id+'" x1="0" y1="0" x2="0" y2="1">'+
   '<stop offset="0" stop-color="'+col+'" stop-opacity=".22"/>'+
   '<stop offset="1" stop-color="'+col+'" stop-opacity="0"/></linearGradient></defs>'+
  '<path d="'+line+' L'+w+' '+h+' L0 '+h+' Z" fill="url(#'+id+')"/>'+
  '<path d="'+line+'" fill="none" stroke="'+col+'" stroke-width="1.7" '+
   'stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function microbars(vals,cols){
 var w=104,h=34,mx=Math.max.apply(null,vals)||1,n=vals.length,bw=(w-(n-1)*4)/n;
 return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+
  vals.map(function(v,i){var bh=Math.max(2,(v/mx)*(h-4));
   return '<rect x="'+(i*(bw+4)).toFixed(1)+'" y="'+(h-bh).toFixed(1)+'" width="'+bw.toFixed(1)+
    '" height="'+bh.toFixed(1)+'" rx="2" fill="'+(cols[i]||'#B9975B')+'" opacity=".85"/>';
  }).join('')+'</svg>';
}
function donut(parts,total,label){
 var R=54,C=2*Math.PI*R,off=0;
 var segs=parts.filter(function(p){return p.v>0;}).map(function(p){
  var len=total?p.v/total*C:0;
  var s='<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="'+p.c+'" stroke-width="18" '+
   'stroke-dasharray="'+len.toFixed(2)+' '+(C-len).toFixed(2)+'" stroke-dashoffset="'+(-off).toFixed(2)+'"/>';
  off+=len; return s;}).join('');
 return '<svg width="140" height="140" viewBox="0 0 140 140">'+
  '<g transform="rotate(-90 70 70)">'+
   '<circle cx="70" cy="70" r="'+R+'" fill="none" stroke="#F2F4F7" stroke-width="18"/>'+segs+'</g>'+
  '<text x="70" y="68" text-anchor="middle" font-size="24" font-weight="680" fill="#101828">'+esc(label)+'</text>'+
  '<text x="70" y="85" text-anchor="middle" font-size="10.5" fill="#98A2B3">Total</text></svg>';
}

/* ---------- activity ---------- */
function activity(){
 var out=[];
 S.deals.forEach(function(d,i){
  (d.hist||[]).forEach(function(h){ if(h&&h.d)
   out.push({d:h.d,t:h.a||'Note',s:d.w,k:'note',ty:'deal',ix:i});});});
 S.diary.forEach(function(x){ if(x&&x.d)
  out.push({d:x.d,t:x.ty||'Diary',s:(x.n||'')+(x.w?' · '+x.w:''),k:'diary'});});
 S.later.forEach(function(x,i){
  (x.att||[]).forEach(function(a){ if(a&&a.d)
   out.push({d:a.d,t:({call:'Called',wa:'WhatsApp sent',sms:'SMS sent',email:'Emailed'}[a.ch]||'Contacted'),

/* =================== generic sortable, exportable table ===================
   Each table view returns a spec. One renderer draws it, one sorter sorts it
   and one exporter writes it out, so the three can never disagree.
   ======================================================================== */
function cmp(a,b){
 if(typeof a==='number'&&typeof b==='number')return a-b;
 return String(a==null?'':a).toLowerCase().localeCompare(String(b==null?'':b).toLowerCase(),
  undefined,{numeric:true,sensitivity:'base'});
}
function sortRows(spec){
 var st=SORT[VIEW];
 if(!st)return spec.rows.slice();
 var col=spec.cols.filter(function(c){return c.k===st.k;})[0];
 if(!col)return spec.rows.slice();
 var r=spec.rows.slice();
 r.sort(function(a,b){var v=cmp(col.val(a),col.val(b));return st.dir<0?-v:v;});
 return r;
}
function drawTable(spec){
 SPEC=spec;
 var st=SORT[VIEW]||{};
 var rows=sortRows(spec);
 var head=spec.cols.map(function(c){
  var on=st.k===c.k;
  return '<th class="'+(c.num?'n ':'')+(on?'on':'')+'" data-sk="'+esc(c.k)+'">'+esc(c.lab)+
   (on?'<i>'+(st.dir<0?'▾':'▴')+'</i>':'<i>·</i>')+'</th>';}).join('');
 var bodyHtml=rows.map(function(r){
  return '<tr data-open="'+esc(spec.type)+':'+r.__i+'">'+
   spec.cols.map(function(c){return '<td'+(c.num?' class="n"':'')+'>'+c.cell(r)+'</td>';}).join('')+
   '</tr>';}).join('');
 return card(spec.title, spec.right||'',
  (spec.note?'<div class="hint" style="margin-bottom:10px">'+spec.note+'</div>':'')+
  '<div class="tw"><table><thead><tr>'+head+'</tr></thead><tbody>'+
  (bodyHtml||'<tr><td colspan="'+spec.cols.length+'" class="mut">Nothing matches.</td></tr>')+
  '</tbody></table></div>', spec.foot||'');
}
function exportCSV(){
 if(!SPEC){alert('Open a list first, then export it.');return;}
 var rows=sortRows(SPEC);
 var q=function(v){v=String(v==null?'':v);
  return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
 var out=[SPEC.cols.map(function(c){return q(c.lab);}).join(',')];
 rows.forEach(function(r){
  out.push(SPEC.cols.map(function(c){
   /* val() is the sort key, so it carries things like 9999 for an unset date
      and a stage number instead of a stage name. exp() is what a human reads. */
   var v=c.exp?c.exp(r):c.val(r);
   if(PRIV&&c.priv)v='hidden';
   return q(v);}).join(','));});
 var blob=new Blob(['﻿'+out.join('\r\n')],{type:'text/csv;charset=utf-8;'});
 var a=document.createElement('a');
 a.href=URL.createObjectURL(blob);
 a.download='daily-'+VIEW+(FILT?'-'+FILT:'')+'-'+TD+'.csv';
 document.body.appendChild(a); a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},900);
}

  foot:'<b>'+L.length+' deals · AED '+pmoney(tot)+' · AED '+pmoney(totw)+' weighted</b>',
  cols:[
   {k:'w',lab:'Client',priv:1,val:function(d){return d.w||'';},
    cell:function(d){return '<b>'+pv(d.w)+'</b><div class="mut">'+esc(String(d.u||'').slice(0,60))+'</div>';}},
   {k:'s',lab:'Stage',val:function(d){return num(d.s);},
    exp:function(d){return STAGES[num(d.s)]||'Lost';},
    cell:function(d){return '<span class="tag '+(num(d.s)>=3?'g':(num(d.s)>=2?'a':'n'))+'">'+
     esc(STAGES[num(d.s)]||'?')+'</span>';}},
   {k:'v',lab:'Value',num:1,priv:1,val:function(d){return num(d.v);},

   {k:'fee',lab:'Fee',num:1,priv:1,val:function(d){return fee(d);},
    cell:function(d){return fee(d)?pmoney(fee(d)):'<span class="mut">—</span>';}},
   {k:'wtd',lab:'Weighted',num:1,priv:1,val:function(d){return weighted(d);},
    cell:function(d){return fee(d)?pmoney(weighted(d)):'<span class="mut">—</span>';}},
   {k:'nd',lab:'Next',val:function(d){return d.nd||'9999';},
    exp:function(d){return d.nd||'';},
    cell:function(d){var od=d.nd&&d.nd<TD;
     return d.nd?'<span class="tag '+(od?'r':'n')+'">'+dmy(d.nd)+'</span>':'<span class="mut">not set</span>';}},
   {k:'na',lab:'Next action',val:function(d){return d.na||'';},
    cell:function(d){return '<span class="mut">'+esc(d.na||'')+'</span>';}}
  ]});
}

function vHist(){
 var R=S.deals.map(function(d,i){d.__i=i;return d;});
 return drawTable({
  title:'Every client', type:'deal', rows:R,
  right:'<span class="tag n">'+R.length+'</span>',
  note:'Everyone on the board, won and lost included. Click a row for the whole story.',
  foot:'<b>'+R.reduce(function(a,d){return a+touches(d);},0)+' logged touches across '+R.length+' clients</b>',
  cols:[
   {k:'w',lab:'Client',priv:1,val:function(d){return d.w||'';},
    cell:function(d){return '<b>'+pv(d.w)+'</b><div class="mut">'+esc(String(d.u||'').slice(0,52))+'</div>';}},
   {k:'s',lab:'Outcome',val:function(d){return num(d.s);},
    exp:function(d){return num(d.s)===5?'Lost':STAGES[num(d.s)];},
    cell:function(d){var s=num(d.s);
     return '<span class="tag '+(s===5?'r':(s===4?'g':(s>=2?'a':'n')))+'">'+
      esc(s===5?'Lost':STAGES[s])+'</span>';}},
   {k:'cAt',lab:'First seen',val:function(d){return d.cAt||'9999';},
    exp:function(d){return d.cAt||'';},
    cell:function(d){return d.cAt?esc(dmy(d.cAt)):'<span class="mut">—</span>';}},
   {k:'last',lab:'Last touch',val:function(d){
     var h=(d.hist||[]).map(function(x){return x.d;}).sort();
     return h.length?h[h.length-1]:(d.sAt||'0000');},
    exp:function(d){var h=(d.hist||[]).map(function(x){return x.d;}).sort();
     return h.length?h[h.length-1]:(d.sAt||'');},
    cell:function(d){var h=(d.hist||[]).map(function(x){return x.d;}).sort();
     var l=h.length?h[h.length-1]:d.sAt;
     return l?esc(dmy(l))+'<div class="mut">'+esc(ago(l))+'</div>':'<span class="mut">—</span>';}},
   {k:'t',lab:'Touches',num:1,val:function(d){return touches(d);},
    cell:function(d){return touches(d)||'<span class="mut">0</span>';}},
   {k:'v',lab:'Value',num:1,priv:1,val:function(d){return num(d.v);},
    cell:function(d){return num(d.v)?pmoney(d.v):'<span class="mut">—</span>';}},
   {k:'fee',lab:'Fee',num:1,priv:1,val:function(d){return fee(d);},
    cell:function(d){return fee(d)?pmoney(fee(d)):'<span class="mut">—</span>';}},
   {k:'src',lab:'Source',val:function(d){return d.src||'';},
    cell:function(d){return '<span class="mut">'+esc(d.src||'')+'</span>';}}
  ]});
}

function vStock(){
 var U=S.units.map(function(u,i){u.__i=i;return u;});
 var tot=U.reduce(function(a,u){return a+num(u.pr);},0);
 return drawTable({
  title:'Stock', type:'unit', rows:U,
  right:'<span class="tag n">'+U.length+' units</span>',
  foot:'<b>AED '+pmoney(tot)+' across '+U.length+' units</b>',
  cols:[
   {k:'p',lab:'Unit',val:function(u){return u.p||'';},
    cell:function(u){return '<b>'+esc(u.p||'—')+'</b><div class="mut">'+esc(u.t||'')+
     (u.rw?' · '+esc(u.rw):'')+'</div>';}},
   {k:'bd',lab:'Beds',num:1,val:function(u){return num(u.bd);},
    cell:function(u){return num(u.bd)||'<span class="mut">—</span>';}},
   {k:'bua',lab:'BUA',num:1,val:function(u){return num(u.bua);},
    cell:function(u){return num(u.bua)?money(u.bua):'<span class="mut">—</span>';}},
   {k:'pr',lab:'Price',num:1,priv:1,val:function(u){return num(u.pr);},
    cell:function(u){return num(u.pr)?pmoney(u.pr):'<span class="mut">—</span>';}},
   {k:'psf',lab:'Per sqft',num:1,priv:1,
    val:function(u){return num(u.bua)?Math.round(num(u.pr)/num(u.bua)):0;},
    cell:function(u){var v=num(u.bua)?Math.round(num(u.pr)/num(u.bua)):0;
     return v?pmoney(v):'<span class="mut">—</span>';}},
   {k:'st',lab:'Status',val:function(u){return uStat(u);},
    cell:function(u){return '<span class="tag '+(uStat(u)==='Sold'?'g':(uStat(u)==='Reserved'?'a':'n'))+'">'+
     esc(uStat(u))+'</span>';}},
   {k:'n',lab:'Note',val:function(u){return u.n||'';},
    cell:function(u){return '<span class="mut">'+esc(String(u.n||'').slice(0,70))+'</span>';}}
  ]});
}

function vProsp(){
 var P=S.later.map(function(x,i){x.__i=i;return x;});
 return drawTable({
  title:'Prospects', type:'prospect', rows:P,
  right:'<span class="tag n">'+P.length+'</span>',
  cols:[
   {k:'n',lab:'Name',priv:1,val:function(x){return x.n||'';},
    cell:function(x){return '<b>'+pv(x.n||'—')+'</b><div class="mut">'+esc(x.w||'')+'</div>';}},
   {k:'v',lab:'Est. value',num:1,priv:1,val:function(x){return num(x.v);},
    cell:function(x){return num(x.v)?pmoney(x.v):'<span class="mut">—</span>';}},
   {k:'att',lab:'Attempts',num:1,val:function(x){return (x.att||[]).length;},
    cell:function(x){return String((x.att||[]).length);}},
   {k:'last',lab:'Last outcome',val:function(x){return x.last||'';},
    cell:function(x){return x.last?'<span class="tag '+
     (x.last==='maybe'?'g':(x.last==='noans'?'a':(x.last==='listed'?'b':'n')))+'">'+esc(x.last)+'</span>':
     '<span class="mut">—</span>';}},
   {k:'lastAt',lab:'When',val:function(x){return x.lastAt||'0000';},
    exp:function(x){return x.lastAt||'';},
    cell:function(x){return x.lastAt?esc(dmy(x.lastAt)):'<span class="mut">—</span>';}},
   {k:'ty',lab:'Type',val:function(x){return x.ty||'';},
    cell:function(x){return '<span class="mut">'+esc(x.ty||'')+'</span>';}}
  ]});
}

function vRent(){
 var R=S.rent.map(function(r,i){r.__i=i;return r;});
 var gross=R.reduce(function(a,r){return a+num(r.amt);},0);
 return drawTable({
  title:'Rent roll', type:'rent', rows:R,
  right:'<span class="tag n">'+R.length+' managed</span>',
  foot:'<b>AED '+pmoney(gross)+' gross · AED '+pmoney(gross*0.05)+' in renewal commission</b>',
  cols:[
   {k:'p',lab:'Property',val:function(r){return r.p||'';},
    cell:function(r){return '<b>'+esc(r.p||'—')+'</b><div class="mut">Landlord · '+pv(r.ll||'—')+'</div>';}},
   {k:'tn',lab:'Tenant',priv:1,val:function(r){return r.tn||'';},
    cell:function(r){return r.tn?pv(r.tn):'<span class="mut">not recorded</span>';}},
   {k:'amt',lab:'Annual rent',num:1,priv:1,val:function(r){return num(r.amt);},
    cell:function(r){return num(r.amt)?pmoney(r.amt):'<span class="mut">—</span>';}},
   {k:'com',lab:'5% at renewal',num:1,priv:1,val:function(r){return num(r.amt)*0.05;},
    cell:function(r){return num(r.amt)?pmoney(num(r.amt)*0.05):'<span class="mut">—</span>';}},
   {k:'ch',lab:'Cheques',val:function(r){return r.ch||'';},cell:function(r){return esc(r.ch||'—');}},
   {k:'st',lab:'Started',val:function(r){return r.st||'0000';},
    exp:function(r){return r.st||'';},
    cell:function(r){return r.st?esc(dmy(r.st)):'<span class="mut">—</span>';}},
   {k:'en',lab:'Renewal',val:function(r){return r.en||'9999';},
    exp:function(r){return r.en||'';},
    cell:function(r){var n2=r.en?days(TD,r.en):null;
     var tone=n2===null?'n':(n2<0?'r':(n2<=90?'a':'g'));
     var lab=n2===null?'no end date':(n2<0?Math.abs(n2)+' days past':n2+' days');
     return '<span class="tag '+tone+'">'+esc(lab)+'</span>';}}
  ]});
}

function vMoney(){
 var L=live();
 var rows=STAGES.map(function(nm,i){
  var g=L.filter(function(d){return num(d.s)===i;});
  return {__i:i,n:nm,c:g.length,
   v:g.reduce(function(a,d){return a+num(d.v);},0),
   f:g.reduce(function(a,d){return a+fee(d);},0),
   w:g.reduce(function(a,d){return a+weighted(d);},0),p:PROB[i]};});
 var tw=rows.reduce(function(a,s){return a+s.w;},0);
 var tf=rows.reduce(function(a,s){return a+s.f;},0);
 var rr=S.rent.reduce(function(a,r){return a+num(r.amt)*0.05;},0);
 SPEC=null;
 var body='<div class="tw"><table><thead><tr><th>Stage</th><th class="n">Deals</th>'+
  '<th class="n">Value</th><th class="n">Fee if won</th><th class="n">Odds</th>'+
  '<th class="n">Weighted</th></tr></thead><tbody>'+
  rows.map(function(s,i){
   return '<tr style="cursor:default"><td><span class="tag n" style="background:'+SCOL[i]+
    '22;color:'+SCOL[i]+'">'+esc(s.n)+'</span></td>'+
    '<td class="n">'+s.c+'</td><td class="n">'+pmoney(s.v)+'</td>'+
    '<td class="n">'+pmoney(s.f)+'</td><td class="n">'+Math.round(s.p*100)+'%</td>'+
    '<td class="n"><b>'+pmoney(s.w)+'</b></td></tr>';}).join('')+
  '<tr style="cursor:default"><td colspan="3"></td><td class="n"><b>'+pmoney(tf)+
  '</b></td><td></td><td class="n"><b>'+pmoney(tw)+'</b></td></tr>'+
  '</tbody></table></div>'+
  '<div class="hint" style="margin-top:14px">Rent renewals add AED '+pmoney(rr)+
  ' at 5% on the '+S.rent.length+' tenancies on record. '+
  'Odds are the ladder already in the app: 10 / 25 / 50 / 80 / 100 per cent by stage.</div>';
 return card('Commission',' ',body,'');
}

function vDiary(){
 var A=activity();
 SPEC=null;
 var rows=A.slice(0,150).map(function(a){
  var tone=a.k==='good'?'g':(a.k==='quiet'?'a':(a.k==='diary'?'b':'n'));
  return '<tr'+(a.ty?' data-open="'+a.ty+':'+a.ix+'"':' style="cursor:default"')+'>'+
   '<td class="mut" style="white-space:nowrap">'+esc(dmy(a.d))+'</td>'+
   '<td><span class="tag '+tone+'">'+esc(a.t)+'</span></td><td>'+pv(a.s)+'</td>'+
   '<td class="mut">'+esc(ago(a.d))+'</td></tr>';}).join('');
 return card('Activity','<span class="tag n">'+A.length+' entries</span>',
  '<div class="tw"><table><thead><tr><th style="cursor:default">Date</th>'+
  '<th style="cursor:default">What</th><th style="cursor:default">Who</th>'+
  '<th style="cursor:default">When</th></tr></thead><tbody>'+
  (rows||'<tr><td colspan="4" class="mut">Nothing logged.</td></tr>')+'</tbody></table></div>','');
}

/* ============================ shell ============================ */
const NAV=[
 ['dash','Dashboard','⌂'],
 ['pipe','Pipeline','◆'],
 ['hist','Every client','◔'],
 ['stock','Stock','▣'],
 ['prosp','Prospects','☏'],
 ['rent','Rent roll','▤'],
 ['money','Commission','$'],
 ['diary','Activity','◷']
];
const TITLES={
 dash:['Operations Dashboard','Your business at a glance. Click anything to open it.'],
 pipe:['Pipeline','Every live deal. Click a column to sort, click a row to open it.'],
 hist:['Every client','Won, lost and live. The whole history in one place.'],
 stock:['Stock','Units on your books.'],
 prosp:['Prospects','Owners you are working for a listing.'],
 rent:['Rent roll','Tenancies you manage and what renews next.'],
 money:['Commission','What lands if the pipeline behaves.'],
 diary:['Activity','Everything logged, newest first.']};

function counts(){
 return {dash:'',pipe:live().length,hist:S.deals.length,stock:S.units.length,
  prosp:S.later.length,rent:S.rent.length,money:'',diary:activity().length};}
function drawNav(){
 var c=counts();
 function nb(x){return '<b data-v="'+x[0]+'" class="'+(VIEW===x[0]?'on':'')+'"><s>'+x[2]+'</s>'+x[1]+
  (c[x[0]]?'<u>'+c[x[0]]+'</u>':'')+'</b>';}
 document.getElementById('nav').innerHTML=
  '<div class="navsep">Overview</div>'+NAV.slice(0,1).map(nb).join('')+
  '<div class="navsep">Work</div>'+NAV.slice(1).map(nb).join('');
 document.getElementById('mnav').innerHTML=NAV.map(function(x){
  return '<b data-v="'+x[0]+'" class="'+(VIEW===x[0]?'on':'')+'">'+x[1]+
   (c[x[0]]?' '+c[x[0]]:'')+'</b>';}).join('');
 document.querySelectorAll('nav b,.mnav b').forEach(function(b){
  b.onclick=function(){go(b.dataset.v);};});
}
function go(v,f){
 VIEW=v; FILT=f||null; closePanel(); drawNav();
 var t=TITLES[v]||TITLES.dash;
 document.getElementById('ttl').textContent=t[0];
 document.getElementById('tsub').textContent=t[1];
 draw();
 window.scrollTo({top:0,behavior:'smooth'});
}
function banner(){
 var el=document.getElementById('banner');
 if(!hasData()){el.innerHTML='';return;}
 var age=dataAge();
 if(age!==null&&age>=STALE_DAYS){
  el.innerHTML='<div class="ban red"><span>⚠</span><div><b>This data is '+age+' days old.</b> '+
   'The last backup in '+esc(SRC)+' was '+esc(dmy(S.bkAt||(S.sync&&S.sync.at)))+'. '+
   'Open Daily, go to More, and export a fresh backup before you rely on anything below.</div></div>';
 } else if(age===null){
  el.innerHTML='<div class="ban grey"><span>·</span><div>No backup date on this data, so I cannot '+
   'tell you how fresh it is.</div></div>';
 } else el.innerHTML='';
}
function draw(){
 var el=document.getElementById('body');
 if(!hasData()){ el.innerHTML=empty(); banner(); wireDrop(); return; }
 banner();
 var h='';
 if(VIEW==='dash')h=vDash();
 else if(VIEW==='pipe')h=vPipe();
 else if(VIEW==='hist')h=vHist();
 else if(VIEW==='stock')h=vStock();
 else if(VIEW==='prosp')h=vProsp();
 else if(VIEW==='rent')h=vRent();
 else if(VIEW==='money')h=vMoney();
 else if(VIEW==='diary')h=vDiary();
 el.innerHTML=h;
 document.getElementById('csv').classList.toggle('hide',!SPEC);

 el.querySelectorAll('[data-go]').forEach(function(b){
  b.onclick=function(){var g=b.dataset.go; if(!g)return;
   var p=g.split(':'); go(p[0],p[1]);};});
 el.querySelectorAll('[data-open]').forEach(function(b){
  b.onclick=function(e){e.stopPropagation();
   var p=b.dataset.open.split(':'); openPanel(p[0],+p[1]);};});
 el.querySelectorAll('th[data-sk]').forEach(function(th){
  th.onclick=function(){
   var k=th.dataset.sk, cur=SORT[VIEW];
   SORT[VIEW]=(cur&&cur.k===k)?{k:k,dir:-cur.dir}:{k:k,dir:1};
   draw();};});
}
function empty(){
 return '<div class="drop" id="drop"><div style="font-size:15px;font-weight:600;margin-bottom:6px">'+
  'No data in this browser yet</div>'+
  '<div class="hint" style="max-width:460px;margin:0 auto 16px">This page reads the same store as your app. '+
  'If you use Daily on this machine, open <b>index.html</b> or <b>desk.html</b> once and come back. '+
  'Otherwise drop a backup JSON here to look at it. Nothing is saved.</div>'+
  '<span class="chip" id="pick">Choose a backup file</span></div>';}
function wireDrop(){
 var d=document.getElementById('drop'), p=document.getElementById('pick');
 if(p)p.onclick=function(){document.getElementById('file').click();};
 if(!d)return;
 ['dragenter','dragover'].forEach(function(e){d.addEventListener(e,function(ev){
  ev.preventDefault();d.classList.add('hot');});});
 ['dragleave','drop'].forEach(function(e){d.addEventListener(e,function(ev){
  ev.preventDefault();d.classList.remove('hot');});});
 d.addEventListener('drop',function(ev){ if(ev.dataTransfer.files[0])readFile(ev.dataTransfer.files[0]); });}
function readFile(f){
 var r=new FileReader();
 r.onload=function(){
  try{ var j=JSON.parse(r.result); S=j.S||j; norm(); SRC=f.name; drawNav(); draw();
   document.getElementById('dchip').textContent=f.name+' · read only';
  }catch(e){ alert('That file is not a Daily backup.'); }};
 r.readAsText(f);}

/* header buttons */
document.getElementById('eye').onclick=function(){
 PRIV=!PRIV;
 document.body.classList.toggle('priv',PRIV);
 this.textContent=PRIV?'Show numbers':'Hide numbers';
 this.classList.toggle('on',PRIV);
 draw();};
document.getElementById('csv').onclick=exportCSV;
document.getElementById('load').onclick=function(){document.getElementById('file').click();};
document.getElementById('file').onchange=function(){ if(this.files[0])readFile(this.files[0]); };
document.getElementById('p-x').onclick=closePanel;
document.getElementById('scrim').onclick=closePanel;
document.addEventListener('keydown',function(e){ if(e.key==='Escape')closePanel(); });

/* boot */
load();
document.getElementById('dchip').textContent=new Date().toLocaleDateString('en-GB',
 {weekday:'short',day:'numeric',month:'long',year:'numeric'});
drawNav();
draw();
</script>
</body>
